# ==============================================================================
# CITATION & REFERENCES:
# - Named-volume shadowing: mounting a volume at /app/workspace hides the
#   image's COPY'd files at that path. Only an EMPTY volume is populated
#   from the image on first use; existing volumes are not re-populated.
#   https://docs.docker.com/storage/volumes/#populate-a-volume-using-a-container
#   Code lives at /app/workspace (image), logs at /app/logs (volume).
# - read_only: true plus explicit writable paths:
#   https://docs.docker.com/reference/cli/docker/container/run/#read-only
# - Compose service limits (cpus, mem_limit, pids_limit, ulimits) are the
#   non-Swarm controls; deploy.resources is Swarm-oriented:
#   https://docs.docker.com/compose/compose-file/deploy/
# - Docker shares the host kernel; this is isolation, not virtualisation:
#   https://docs.docker.com/engine/security/
# - Kerrisk (2020), ISBN 978-1-59327-220-3.
# - Maurice et al. (2017), ISBN 978-1-5090-5533-3, DOI 10.1109/SP.2017.31.
# ==============================================================================
# HONEST LIMITS:
#   cap_drop, no-new-privileges, read-only rootfs, pids_limit and a private
#   bridge reduce ordinary container risk. They do NOT stop kernel exploits,
#   shared-cache side channels, or a hostile host. taskset pins the probe
#   process only; the container itself is not CPU-isolated.
# ==============================================================================
name: defensive-agent-harness

services:
  defensive_harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: defensive-agent-harness:local
    container_name: local_red_team_harness
    restart: "no"
    init: true
    stop_grace_period: 10s
    networks:
      - isolated_sandbox
    volumes:
      # Target: read-only bind mount (host -> container, single direction).
      - ./target_environment:/app/target:ro
      # Logs: writable named volume. NOT at /app/workspace — that path is
      # code from the image and must not be shadowed.
      - harness_logs:/app/logs:rw
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - HARNESS_TARGET=/app/target
      # audit_logger.py writes here (created by Dockerfile).
      - AUDIT_LOG_PATH=/app/logs/audit_trail.log
    cpus: "1.0"
    mem_limit: "2g"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    command: ["--max-runtime", "120"]
    healthcheck:
      # Verifies the audit chain, not merely that Python starts.
      test: ["CMD", "python3", "/app/workspace/harness_orchestrator.py", "--audit-verify"]
      interval: 30s
      timeout: 5s
      retries: 2

networks:
  isolated_sandbox:
    internal: true

volumes:
  harness_logs:
    driver: local
