# ==============================================================================
# CITATION & REFERENCES:
# - ENTRYPOINT/CMD: command: overrides CMD and is passed as arguments to
#   ENTRYPOINT; duplicating interpreter+script causes argparse to reject the
#   extra positional arguments. Confirmed by execution: exit code 2.
#   https://docs.docker.com/engine/reference/builder/#cmd
# - Top-level project name avoids orphan-container collisions with unrelated
#   projects whose directory is also "repo".
#   https://docs.docker.com/compose/compose-file/05-services/#name
# - deploy is Swarm-oriented; cpus / mem_limit are the non-Swarm reliable form.
#   https://docs.docker.com/compose/compose-file/deploy/
# - Kerrisk (2020), ISBN 978-1-59327-220-3.
# - Maurice et al. (2017), ISBN 978-1-5090-5533-3, DOI 10.1109/SP.2017.31.
# ==============================================================================
name: defensive-agent-harness

services:
  defensive_harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: defensive-agent-harness:local
    container_name: local_red_team_harness
    restart: "no"
    networks:
      - isolated_sandbox
    volumes:
      - ./target_environment:/app/target:ro
      - harness_workspace:/app/workspace:rw
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    cpus: "1.0"
    mem_limit: "2g"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    # FIX (F1): ENTRYPOINT supplies python3 + script; command supplies ONLY
    # the trailing arguments. No duplication.
    command: ["--max-runtime", "120"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 2

networks:
  isolated_sandbox:
    internal: true

volumes:
  harness_workspace:
    driver: local
